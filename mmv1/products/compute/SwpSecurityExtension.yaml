---
name: 'SwpSecurityExtension'
kind: 'compute#swpSecurityExtension'
description: |
  'SwpSecurityExtension' is a resource that allows traffic forwarding to a callout backend to enhance security.
references:
  guides:
    'Service Extensions for Secure Web Proxy': 'https://docs.cloud.google.com/service-extensions/docs/configure-extensions-for-swp'
docs:
base_url: 'projects/{{project}}/locations/{{location}}/swpSecurityExtensions'
has_self_link: true
immutable: true
update_verb: 'PATCH'
collection_url_key: 'items'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
async:
  actions: ['create', 'delete', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: false
examples:
  - name: 'swp_security_extension_basic'
    primary_resource_id: 'swp-security-extension-basic'
    min_version: 'beta'
    test_env_vars:
      project: 'PROJECT_ID'
    vars:
      name: 'swp-security-extension-basic'
      location: us-west1
properties:
  - name: 'name'
    type: String
    description: 'Required. Identifier. Name of the SwpSecurityExtension resource.'
    required: true
    immutable: true
  - name: 'description'
    type: String
    description: 'Optional. A human-readable description of the resource.'
  - name: 'labels'
    type: KeyValueLabels
    description: 'Optional. Set of labels associated with the SwpSecurityExtension resource.'
  - name: 'gateways'
    type: Array
    item_type:
      type: String
    description: 'Required. References to the SecureWebGateway resource to which this service extension is attached.'
    required: true
  - name: 'extensionChains'
    type: Array
    description: 'Required. A set of ordered extension chains that contain the match conditions and extensions to execute.'
    required: true
    item_type:
      type: NestedObject
      properties:
        - name: 'name'
          type: String
          description: 'The name of the extension chain.'
          required: true
        - name: 'matchCondition'
          type: NestedObject
          description: 'The condition that determines if the extensions in this chain are executed.'
          properties:
            - name: 'celExpression'
              type: String
              description: 'A Common Expression Language (CEL) expression.'
              required: true
        - name: 'extensions'
          type: Array
          description: 'A list of extensions to execute if the matchCondition is met.'
          required: true
          item_type:
            type: NestedObject
            properties:
              - name: 'name'
                type: String
                description: 'Optional. The name for this extension.'
              - name: 'service'
                type: String
                description: 'Required. The reference to the service that runs the extension.'
                required: true
              - name: 'authority'
                type: String
                description: 'Optional. The :authority header in the gRPC request.'
              - name: 'timeout'
                type: String
                description: 'Optional. Specifies the timeout for each individual message.'
              - name: 'failOpen'
                type: Boolean
                description: 'Optional. Proxy behavior if the call fails.'
                default_value: false
              - name: 'forwardHeaders'
                type: Array
                item_type:
                  type: String
                description: 'Optional. List of the HTTP headers to forward.'
              - name: 'forwardAttributes'
                type: Array
                item_type:
                  type: String
                description: 'Optional. List of the Envoy attributes to forward.'
              - name: 'supportedEvents'
                type: Array
                item_type:
                  type: String
                description: 'Optional. Set of events for which this extension is called.'
              - name: 'requestBodySendMode'
                type: Enum
                description: 'Optional. Configures the send mode for request body processing.'
                enum_values:
                  - 'BODY_SEND_MODE_UNSPECIFIED'
                  - 'BODY_SEND_MODE_STREAMED'
                  - 'BODY_SEND_MODE_FULL_DUPLEX_STREAMED'
              - name: 'responseBodySendMode'
                type: Enum
                description: 'Optional. Configures the send mode for response body processing.'
                enum_values:
                  - 'BODY_SEND_MODE_UNSPECIFIED'
                  - 'BODY_SEND_MODE_STREAMED'
                  - 'BODY_SEND_MODE_FULL_DUPLEX_STREAMED'
              - name: 'metadata'
                type: KeyValuePairs
                description: 'Optional. Metadata included in the ProcessingRequest message.'
              - name: 'allowDynamicForwarding'
                type: Boolean
                description: 'Optional. Allows response to set dynamic_forwarding namespace.'
              - name: 'observabilityMode'
                type: Boolean
                description: 'Optional. Asynchronous calls to the extension backend.'
